openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for hypertrophy workout tracking
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: Local training profiles
  - name: training
    description: Exercise library and training splits
  - name: workouts
    description: Active workouts and workout history
  - name: mesocycles
    description: Mesocycle planning, templates, weeks, and calendar
  - name: beta-feedback
    description: Beta feedback submitted by authenticated athletes
paths:
  /profiles/{profileId}/reset-training:
    post:
      operationId: resetTrainingData
      tags: [profiles]
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: { type: string, enum: [RESET] }
              additionalProperties: false
      responses:
        "204": { description: "Selected profile training data cleared; profile, settings and library retained" }
        "400": { description: Exact RESET confirmation is required }
        "404": { description: Profile not found }
  /mesocycles/{splitId}/delete-unstarted:
    delete:
      operationId: deleteUnstartedMesocycle
      tags: [mesocycles]
      parameters:
        - { name: splitId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Unstarted mesocycle removed }
  /planned-workouts/{plannedId}/prescription:
    get:
      operationId: getPlannedPrescription
      tags: [mesocycles]
      parameters:
        - { name: plannedId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Persisted next-exposure prescription or explicit uncalculated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V22Document" }
  /mesocycles/{splitId}/lifecycle:
    post:
      operationId: transitionMesocycle
      tags: [mesocycles]
      parameters:
        - { name: splitId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifecycleInput" }
      responses:
        "200":
          description: Lifecycle state and optional new instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V22Document" }
  /mesocycles/{splitId}/weeks:
    post:
      operationId: addLoadingWeek
      tags: [mesocycles]
      parameters:
        - { name: splitId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddWeekInput" }
      responses:
        "200":
          description: Updated weeks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V22Document" }
  /mesocycles/{splitId}/loading-week:
    delete:
      operationId: removeFinalLoadingWeek
      tags: [mesocycles]
      parameters:
        - { name: splitId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Final unstarted loading week removed, recovery remains anchored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V22Document" }
  /workouts/{sessionId}/structure-changes:
    get:
      operationId: getWorkoutStructureChanges
      tags: [workouts]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Structural changes, feedback and recovery context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V22Document" }
  /workouts/{sessionId}/exercises/{workoutExerciseId}/recovery:
    post:
      operationId: adjustExerciseRecovery
      tags: [workouts]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer } }
        - { name: workoutExerciseId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryChoiceInput" }
      responses:
        "200":
          description: Today-only recovery choice saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSession" }
  /workouts/{sessionId}/exercises/{workoutExerciseId}/post-feedback:
    put:
      operationId: saveExercisePostFeedback
      tags: [workouts]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer } }
        - { name: workoutExerciseId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostFeedbackInput" }
      responses:
        "200":
          description: Feedback saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V22Document" }
  /workouts/{sessionId}/exercises/{workoutExerciseId}/order:
    patch:
      operationId: reorderWorkoutExercise
      tags: [workouts]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer } }
        - { name: workoutExerciseId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderInput" }
      responses:
        "200":
          description: Exercise order saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSession" }
  /workouts/{sessionId}/exercises/{workoutExerciseId}/remove:
    post:
      operationId: removeWorkoutExercise
      tags: [workouts]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer } }
        - { name: workoutExerciseId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveExerciseInput" }
      responses:
        "200":
          description: Exercise archived, performed sets remain in history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSession" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List training profiles
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Legacy profile creation is disabled; accounts receive one profile automatically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Created profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "409":
          description: Accounts can only have one training profile
  /profiles/{profileId}:
    patch:
      operationId: updateProfile
      tags: [profiles]
      summary: Rename a training profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/NotFound"
  /profiles/{profileId}/training-mode:
    patch:
      operationId: updateProfileTrainingMode
      tags: [profiles]
      summary: Change the account's mode without altering an active session snapshot
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingModeUpdate" }
      responses:
        "200":
          description: Updated mode or a pending mode change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingModeUpdateResult" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Active workout requires an explicit mode-change action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /overview:
    get:
      operationId: getOverview
      tags: [workouts]
      summary: Get the profile dashboard overview
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileOverview"
  /exercises:
    get:
      operationId: listExercises
      tags: [training]
      summary: Search the exercise library
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: muscleGroup
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [strength, bodyweight, calisthenics, cardio, plyometric, carry, sled, conditioning, mobility, other]
      responses:
        "200":
          description: Exercises available to this profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"
    post:
      operationId: createExercise
      tags: [training]
      summary: Add a custom exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseInput"
      responses:
        "201":
          description: Created exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
  /profiles/{profileId}/exercises/{exerciseId}/history:
    get:
      operationId: getExerciseHistory
      tags: [workouts]
      summary: Get previous completed sets for an exercise
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema:
            type: integer
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recent completed sets, newest session first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseHistoryEntry"
  /profiles/{profileId}/records:
    get:
      operationId: getPersonalRecords
      tags: [workouts]
      summary: Get completed working-set records for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exercise records and chronological qualifying set history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalRecords"
  /splits:
    get:
      operationId: listSplits
      tags: [training]
      summary: List workout splits for a profile
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workout splits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingSplit"
    post:
      operationId: createSplit
      tags: [training]
      summary: Create a workout split
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitInput"
      responses:
        "201":
          description: Created split
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSplit"
  /splits/{splitId}:
    get:
      operationId: getSplit
      tags: [training]
      summary: Get a split and its workout days
      parameters:
        - name: splitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Split with days and exercises
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSplit"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSplit
      tags: [training]
      summary: Update split name or workout order
      parameters:
        - name: splitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitUpdate"
      responses:
        "200":
          description: Updated split
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSplit"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveMesocycle
      tags: [training]
      summary: Atomically replace a complete mesocycle draft
      parameters:
        - name: splitId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMesocycleInput"
      responses:
        "200":
          description: Saved mesocycle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingSplit" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A started or completed week prevents this draft change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /profiles/{profileId}/engine-settings:
    get:
      operationId: getProfileEngineSettings
      tags: [profiles]
      summary: Get progression and recovery engine settings for a profile
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Profile engine settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEngineSettings" }
    patch:
      operationId: updateProfileEngineSettings
      tags: [profiles]
      summary: Update progression and recovery engine settings
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileEngineSettingsInput" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEngineSettings" }
  /mesocycles/templates:
    get:
      operationId: listMesocycleTemplates
      tags: [mesocycles]
      summary: List editable Legendary Progression mesocycle templates
      responses:
        "200":
          description: Available templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MesocycleTemplate" }
  /mesocycles/copy-options:
    get:
      operationId: getMesocycleCopyOptions
      tags: [mesocycles]
      summary: List eligible fully completed loading weeks for copying
      parameters:
        - { name: profileId, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Eligible source weeks, with recommended most recent week
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MesocycleCopyOptions" }
  /mesocycles:
    post:
      operationId: createMesocycle
      tags: [mesocycles]
      summary: Atomically create a complete mesocycle from a template, prior week, or custom draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MesocycleCreateInput" }
      responses:
        "201":
          description: Created mesocycle with weeks, days, and scheduled workout occurrences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mesocycle" }
        "400":
          description: Invalid or incomplete draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /mesocycles/{splitId}:
    delete:
      operationId: deleteMesocyclePreservingHistory
      tags: [mesocycles]
      parameters:
        - { name: splitId, in: path, required: true, schema: { type: integer } }
        - { name: profileId, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Plan removed; completed history preserved }
        "400": { description: Finish an active workout before deleting its plan }
        "404": { description: Plan not found for this profile }
    get:
      operationId: getMesocycle
      tags: [mesocycles]
      summary: Get a mesocycle with normalized weeks and planned workout occurrences
      parameters:
        - { name: splitId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Mesocycle and ordered weeks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mesocycle" }
        "404": { $ref: "#/components/responses/NotFound" }
  /mesocycles/{splitId}/weeks/{weekId}:
    delete:
      operationId: removeMesocycleWeek
      tags: [mesocycles]
      summary: Remove an unstarted future week; started/completed weeks are protected
      parameters:
        - { name: splitId, in: path, required: true, schema: { type: integer } }
        - { name: weekId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Future week removed }
        "409":
          description: Started or completed weeks cannot be removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /mesocycles/calendar:
    get:
      operationId: getMesocycleCalendar
      tags: [mesocycles]
      summary: Get past, today, and future workout occurrences with projected targets
      parameters:
        - { name: profileId, in: query, required: true, schema: { type: integer } }
        - { name: splitId, in: query, required: true, schema: { type: integer } }
        - { name: from, in: query, required: false, schema: { $ref: "#/components/schemas/DateOnly" } }
        - { name: to, in: query, required: false, schema: { $ref: "#/components/schemas/DateOnly" } }
      responses:
        "200":
          description: Calendar occurrence list with stable week identity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarWeek" }
  /planned-workouts/{plannedWorkoutId}/reschedule:
    patch:
      operationId: reschedulePlannedWorkout
      tags: [mesocycles]
      summary: Reschedule within the same week without changing week identity or RIR
      parameters:
        - { name: plannedWorkoutId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RescheduleWorkoutInput" }
      responses:
        "200":
          description: Rescheduled occurrence; close-spacing warnings never block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RescheduleWorkoutResult" }
        "409":
          description: Occurrence is completed or date is outside the fixed week
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /profiles/{profileId}/exercises/{exerciseId}/baseline:
    get:
      operationId: getExerciseBaseline
      tags: [workouts]
      summary: Get exercise-specific baseline state and provenance
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: integer } }
        - { name: exerciseId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Baseline state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseBaseline" }
  /splits/{splitId}/days:
    post:
      operationId: createSplitDay
      tags: [training]
      summary: Add a workout day to a split
      parameters:
        - name: splitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitDayInput"
      responses:
        "201":
          description: Created workout day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitDay"
  /split-days/{dayId}:
    patch:
      operationId: updateSplitDay
      tags: [training]
      summary: Rename or reorder a workout day
      parameters:
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitDayUpdate"
      responses:
        "200":
          description: Updated workout day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitDay"
  /split-days/{dayId}/exercises:
    post:
      operationId: addExerciseToSplitDay
      tags: [training]
      summary: Add an exercise prescription to a workout day
      parameters:
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitDayExerciseInput"
      responses:
        "201":
          description: Created prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitDayExercise"
  /split-day-exercises/{dayExerciseId}:
    patch:
      operationId: updateSplitDayExercise
      tags: [training]
      summary: Change an exercise prescription
      parameters:
        - name: dayExerciseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitDayExerciseUpdate"
      responses:
        "200":
          description: Updated prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitDayExercise"
    delete:
      operationId: removeExerciseFromSplitDay
      tags: [training]
      summary: Remove an exercise from a workout day
      parameters:
        - name: dayExerciseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
  /workouts:
    get:
      operationId: listWorkouts
      tags: [workouts]
      summary: List completed workouts
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recent completed workouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutSummary"
  /workouts/calendar-history:
    get:
      operationId: listWorkoutCalendarHistory
      tags: [workouts]
      summary: List all completed session dates for the account Calendar
      parameters:
        - name: profileId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Completed sessions ordered by their actual start date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutCalendarHistoryEntry"
  /workouts/active:
    get:
      operationId: getActiveWorkout
      tags: [workouts]
      summary: Restore the active session for a profile, if present
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveWorkoutState"
  /workouts/start:
    post:
      operationId: startWorkout
      tags: [workouts]
      summary: Start the next workout day or resume the profile's active session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartWorkoutInput"
      responses:
        "201":
          description: Active workout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSession"
  /workouts/{sessionId}:
    get:
      operationId: getWorkout
      tags: [workouts]
      summary: Get a workout session and all logged sets
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workout details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSession"
        "404":
          $ref: "#/components/responses/NotFound"
  /workouts/{sessionId}/exercises:
    post:
      operationId: addExerciseToWorkout
      tags: [workouts]
      summary: Add an exercise during an active workout
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutExerciseInput"
      responses:
        "201":
          description: Added workout exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutExercise"
  /workouts/{sessionId}/exercises/{workoutExerciseId}:
    patch:
      operationId: substituteWorkoutExercise
      tags: [workouts]
      summary: Substitute an exercise during the active workout
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
        - name: workoutExerciseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutExerciseSubstitution"
      responses:
        "200":
          description: Substituted workout exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutExercise"
  /workouts/{sessionId}/exercises/{workoutExerciseId}/feedback:
    patch:
      operationId: updateWorkoutExercise
      tags: [workouts]
      summary: Record skipped status and pain feedback
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - name: workoutExerciseId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutExerciseFeedback" }
      responses:
        "200":
          description: Updated workout exercise
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutExercise" }
  /workouts/{sessionId}/sets:
    post:
      operationId: createWorkoutSet
      tags: [workouts]
      summary: Add a warm-up or working set to an active workout
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutSetInput"
      responses:
        "201":
          description: Created set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSet"
  /workouts/{sessionId}/sets/{setId}:
    patch:
      operationId: updateWorkoutSet
      tags: [workouts]
      summary: Update logged set performance
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
        - name: setId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutSetUpdate"
      responses:
        "200":
          description: Updated set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSet"
    post:
      operationId: completeWorkoutSet
      tags: [workouts]
      summary: Explicitly complete a validated set and unlock the next incomplete working set
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer } }
        - { name: setId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutSetCompletionInput" }
      responses:
        "200":
          description: Completed set and updated sequential workflow state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSetWorkflowResult" }
        "400":
          description: Required performance values are missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Set is locked or completed without explicit edit intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: removeWorkoutSet
      tags: [workouts]
      summary: Soft-remove a working set
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - name: setId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Removed }
  /workouts/{sessionId}/finish:
    post:
      operationId: finishWorkout
      tags: [workouts]
      summary: Complete a workout, calculate its volume, and advance the split
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinishStructureInput" }
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completed workout summary and next day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinishWorkoutResult"
  /beta-feedback:
    get:
      operationId: listBetaFeedback
      tags: [beta-feedback]
      summary: List beta feedback visible to authenticated athletes
      responses:
        "200":
          description: Feedback entries and whether the current user can manage them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaFeedbackList" }
    post:
      operationId: createBetaFeedback
      tags: [beta-feedback]
      summary: Submit beta feedback for the authenticated athlete
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BetaFeedbackInput" }
      responses:
        "201":
          description: Feedback submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaFeedbackEntry" }
        "400": { description: Feedback input is invalid }
  /beta-feedback/{feedbackId}/status:
    patch:
      operationId: updateBetaFeedbackStatus
      tags: [beta-feedback]
      summary: Change a feedback status (feedback manager or owner only)
      parameters:
        - { name: feedbackId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BetaFeedbackStatusUpdate" }
      responses:
        "200":
          description: Updated feedback entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaFeedbackEntry" }
        "400": { description: Feedback status is invalid }
        "403": { description: Feedback manager access required }
        "404": { description: Feedback not found }
  /beta-feedback/{feedbackId}:
    delete:
      operationId: deleteBetaFeedback
      tags: [beta-feedback]
      summary: Remove beta feedback (feedback manager or owner only)
      parameters:
        - { name: feedbackId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Feedback removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaFeedbackDeleteResult" }
        "403": { description: Feedback manager access required }
        "404": { description: Feedback not found }
  /beta-feedback/managers:
    get:
      operationId: listBetaFeedbackManagers
      tags: [beta-feedback]
      summary: List feedback managers and eligible accounts (owner only)
      responses:
        "200":
          description: Manager assignments and eligible existing accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaFeedbackManagersList" }
        "403": { description: Feedback owner access required }
    post:
      operationId: grantBetaFeedbackManager
      tags: [beta-feedback]
      summary: Grant feedback manager permission (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BetaFeedbackManagerInput" }
      responses:
        "201":
          description: Feedback manager permission granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaFeedbackManager" }
        "400": { description: Invalid target profile }
        "403": { description: Feedback owner access required }
        "404": { description: Existing account not found }
        "409": { description: Account already has feedback permission }
  /beta-feedback/managers/{targetProfileId}:
    delete:
      operationId: revokeBetaFeedbackManager
      tags: [beta-feedback]
      summary: Revoke feedback manager permission (owner only)
      parameters:
        - { name: targetProfileId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Feedback manager permission revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaFeedbackManagerRevokeResult" }
        "403": { description: Feedback owner access required }
        "404": { description: Feedback manager not found }
components:
  schemas:
    BetaFeedbackCategory:
      type: string
      enum: [bug, missing, suggestion, confusing]
    BetaFeedbackStatus:
      type: string
      enum: [reported, planned, fixed]
    BetaFeedbackEntry:
      type: object
      required: [id, category, description, reporterName, status, createdAt]
      properties:
        id: { type: integer }
        category: { $ref: "#/components/schemas/BetaFeedbackCategory" }
        description: { type: string }
        reporterName: { type: string }
        status: { $ref: "#/components/schemas/BetaFeedbackStatus" }
        createdAt: { type: string, format: date-time }
    BetaFeedbackList:
      type: object
      required: [entries, canManage, canManageManagers]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/BetaFeedbackEntry" }
        canManage: { type: boolean }
        canManageManagers: { type: boolean }
    BetaFeedbackInput:
      type: object
      required: [category, description]
      properties:
        category: { $ref: "#/components/schemas/BetaFeedbackCategory" }
        description: { type: string, minLength: 5, maxLength: 2000 }
      additionalProperties: false
    BetaFeedbackStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/BetaFeedbackStatus" }
      additionalProperties: false
    BetaFeedbackDeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean, enum: [true] }
    BetaFeedbackManager:
      type: object
      required: [profileId, name, grantedAt]
      properties:
        profileId: { type: integer }
        name: { type: string }
        grantedAt: { type: string, format: date-time }
    BetaFeedbackManagerCandidate:
      type: object
      required: [profileId, name]
      properties:
        profileId: { type: integer }
        name: { type: string }
    BetaFeedbackManagersList:
      type: object
      required: [managers, candidates]
      properties:
        managers:
          type: array
          items: { $ref: "#/components/schemas/BetaFeedbackManager" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/BetaFeedbackManagerCandidate" }
    BetaFeedbackManagerInput:
      type: object
      required: [targetProfileId]
      properties:
        targetProfileId: { type: integer, minimum: 1 }
      additionalProperties: false
    BetaFeedbackManagerRevokeResult:
      type: object
      required: [revoked]
      properties:
        revoked: { type: boolean, enum: [true] }
    V22Document:
      type: object
      additionalProperties: true
    LifecycleInput:
      type: object
      required: [profileId, action]
      properties:
        profileId: { type: integer }
        action: { type: string, enum: [activate, pause, resume, end_early, restart] }
        recalibrateAll: { type: boolean }
        startDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    AddWeekInput:
      type: object
      required: [profileId, targetRir]
      properties:
        profileId: { type: integer }
        targetRir: { type: number, minimum: 0, maximum: 10 }
    RecoveryChoiceInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [train_as_planned, reduce_load, reduce_sets, reduce_both, skip_today] }
        persistentChoice: { type: string, enum: [reduce_working_sets, keep_current_volume, no_change] }
    PostFeedbackInput:
      type: object
      required: [pump, fatigue, discomfort]
      properties:
        pump: { type: string, enum: [none, low, good, great] }
        fatigue: { type: string, enum: [low, moderate, high, too_much] }
        discomfort: { type: string, enum: [none, mild, moderate, significant] }
    ReorderInput:
      type: object
      required: [direction]
      properties:
        direction: { type: string, enum: [up, down] }
    RemoveExerciseInput:
      type: object
      required: [scope]
      properties:
        scope: { type: string, enum: [today_only, mesocycle] }
    FinishStructureInput:
      type: object
      properties:
        structureDecision: { type: string, enum: [today_only, keep] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Profile:
      type: object
      required: [id, name, trainingExperience, onboardingComplete, weightUnit, trainingMode, pendingTrainingMode, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        trainingExperience:
          type: ["string", "null"]
          enum: [beginner, intermediate, advanced, null]
        onboardingComplete: { type: boolean }
        weightUnit: { type: string, enum: [kg, lb] }
        trainingMode: { type: string, enum: [basic, legendary_pro] }
        pendingTrainingMode: { type: ["string", "null"], enum: [basic, legendary_pro, null] }
        createdAt: { type: string, format: date-time }
    TrainingModeUpdate:
      type: object
      required: [trainingMode]
      properties:
        trainingMode: { type: string, enum: [basic, legendary_pro] }
        activeSessionAction: { type: string, enum: [finish_current, cancel_today, keep_current] }
    TrainingModeUpdateResult:
      type: object
      required: [profile, activeWorkoutId, pending]
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
        activeWorkoutId: { type: ["integer", "null"] }
        pending: { type: boolean }
    ProfileInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    ProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        weightUnit: { type: string, enum: [kg, lb] }
        trainingExperience:
          type: ["string", "null"]
          enum: [beginner, intermediate, advanced, null]
        onboardingComplete: { type: boolean }
    ExerciseMetricDefinition:
      type: object
      required: [type, label, unit, required]
      properties:
        type: { type: string, enum: [weight, reps, distance, time, height, elevation, calories, steps] }
        label: { type: string, minLength: 1, maxLength: 24 }
        unit: { type: string, enum: [profile, kg, lb, reps, m, km, mi, ft, cm, in, s, min, h, kcal, steps] }
        required: { type: boolean }
    Exercise:
      type: object
      required: [id, profileId, name, muscleGroup, equipment, category, metricDefinitions, isCompound, secondaryMuscles, aliases, defaultRepMin, defaultRepMax, loadIncrementLb, loadIncrementKg, createdAt]
      properties:
        id: { type: integer }
        profileId: { type: ["integer", "null"] }
        name: { type: string }
        muscleGroup: { type: string }
        equipment: { type: string }
        category: { type: string, enum: [strength, bodyweight, calisthenics, cardio, plyometric, carry, sled, conditioning, mobility, other] }
        metricDefinitions:
          type: ["array", "null"]
          maxItems: 2
          items: { $ref: "#/components/schemas/ExerciseMetricDefinition" }
        instructions: { type: ["string", "null"] }
        isCompound: { type: boolean }
        secondaryMuscles: { type: array, items: { type: string } }
        aliases: { type: array, items: { type: string } }
        defaultRepMin: { type: integer }
        defaultRepMax: { type: integer }
        loadIncrementLb: { type: ["number", "null"], exclusiveMinimum: 0 }
        loadIncrementKg: { type: ["number", "null"], exclusiveMinimum: 0 }
        createdAt: { type: string, format: date-time }
    ExerciseInput:
      type: object
      required: [profileId, name, muscleGroup, equipment, isCompound]
      properties:
        profileId: { type: integer }
        name: { type: string, minLength: 1, maxLength: 120 }
        muscleGroup: { type: string, minLength: 1, maxLength: 60 }
        equipment: { type: string, minLength: 1, maxLength: 80 }
        category: { type: string, enum: [strength, bodyweight, calisthenics, cardio, plyometric, carry, sled, conditioning, mobility, other], default: strength }
        metricDefinitions:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/ExerciseMetricDefinition" }
        instructions: { type: ["string", "null"] }
        isCompound: { type: boolean }
        secondaryMuscles: { type: array, items: { type: string } }
        aliases: { type: array, items: { type: string } }
        defaultRepMin: { type: integer, minimum: 1, maximum: 100, default: 8 }
        defaultRepMax: { type: integer, minimum: 1, maximum: 100, default: 12 }
        loadIncrementLb: { type: ["number", "null"], exclusiveMinimum: 0 }
        loadIncrementKg: { type: ["number", "null"], exclusiveMinimum: 0 }
    SplitDayExercise:
      type: object
      required: [id, dayId, exerciseId, orderIndex, targetSets, minimumWorkingSets, maximumWorkingSets, targetRepsMin, targetRepsMax, targetRir, exercise]
      properties:
        id: { type: integer }
        dayId: { type: integer }
        exerciseId: { type: integer }
        orderIndex: { type: integer }
        targetSets: { type: integer }
        minimumWorkingSets: { type: integer }
        maximumWorkingSets: { type: integer }
        targetRepsMin: { type: integer }
        targetRepsMax: { type: integer }
        targetRir: { type: number }
        targetWeight: { type: ["number", "null"] }
        exercise: { $ref: "#/components/schemas/Exercise" }
    SplitDayExerciseInput:
      type: object
      required: [exerciseId, orderIndex, targetSets, targetRepsMin, targetRepsMax, targetRir]
      properties:
        exerciseId: { type: integer }
        orderIndex: { type: integer, minimum: 0 }
        targetSets: { type: integer, minimum: 1, maximum: 20 }
        minimumWorkingSets: { type: integer, minimum: 1, maximum: 20, default: 1 }
        maximumWorkingSets: { type: integer, minimum: 1, maximum: 20, default: 5 }
        targetRepsMin: { type: integer, minimum: 1, maximum: 100 }
        targetRepsMax: { type: integer, minimum: 1, maximum: 100 }
        targetRir: { type: number, minimum: 0, maximum: 10 }
        targetWeight: { type: ["number", "null"], minimum: 0 }
    SplitDayExerciseUpdate:
      type: object
      properties:
        orderIndex: { type: integer, minimum: 0 }
        targetSets: { type: integer, minimum: 1, maximum: 20 }
        minimumWorkingSets: { type: integer, minimum: 1, maximum: 20 }
        maximumWorkingSets: { type: integer, minimum: 1, maximum: 20 }
        targetRepsMin: { type: integer, minimum: 1, maximum: 100 }
        targetRepsMax: { type: integer, minimum: 1, maximum: 100 }
        targetRir: { type: number, minimum: 0, maximum: 10 }
        targetWeight: { type: ["number", "null"], minimum: 0 }
    SplitDay:
      type: object
      required: [id, splitId, name, dayIndex, exercises]
      properties:
        id: { type: integer }
        splitId: { type: integer }
        name: { type: string }
        dayIndex: { type: integer }
        exercises:
          type: array
          items: { $ref: "#/components/schemas/SplitDayExercise" }
    SplitDayInput:
      type: object
      required: [name, dayIndex]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        dayIndex: { type: integer, minimum: 0 }
    SplitDayUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        dayIndex: { type: integer, minimum: 0 }
    TrainingSplit:
      type: object
      required: [id, profileId, name, nextDayIndex, startDate, cycleLengthWeeks, currentWeek, days]
      properties:
        hasWorkoutHistory: { type: boolean }
        lifecycleStatus: { type: string, enum: [planned, active, paused, completed, ended_early, restarted] }
        completedWeeks: { type: integer, minimum: 0 }
        programmingVersion: { type: string }
        pausedAt: { type: ["string", "null"] }
        endedAt: { type: ["string", "null"] }
        restartFromId: { type: ["integer", "null"] }
        id: { type: integer }
        profileId: { type: integer }
        name: { type: string }
        nextDayIndex: { type: integer }
        startDate: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
        cycleLengthWeeks: { type: integer }
        currentWeek: { type: integer }
        days:
          type: array
          items: { $ref: "#/components/schemas/SplitDay" }
    SplitInput:
      type: object
      required: [profileId, name]
      properties:
        profileId: { type: integer }
        name: { type: string, minLength: 1, maxLength: 100 }
    SplitUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        nextDayIndex: { type: integer, minimum: 0 }
        startDate: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
        cycleLengthWeeks: { type: integer, minimum: 1, maximum: 52 }
    MesocycleExerciseInput:
      type: object
      required: [exerciseId, orderIndex, targetSets, minimumWorkingSets, maximumWorkingSets, targetRepsMin, targetRepsMax, targetRir]
      properties:
        id: { type: integer }
        exerciseId: { type: integer }
        orderIndex: { type: integer, minimum: 0 }
        targetSets: { type: integer, minimum: 1, maximum: 20 }
        minimumWorkingSets: { type: integer, minimum: 1, maximum: 20 }
        maximumWorkingSets: { type: integer, minimum: 1, maximum: 20 }
        targetRepsMin: { type: integer, minimum: 1, maximum: 100 }
        targetRepsMax: { type: integer, minimum: 1, maximum: 100 }
        targetRir: { type: number, minimum: 0, maximum: 10 }
        targetWeight: { type: ["number", "null"], minimum: 0 }
    MesocycleDayInput:
      type: object
      required: [name, dayIndex, exercises]
      properties:
        id: { type: integer }
        name: { type: string, minLength: 1, maxLength: 80 }
        dayIndex: { type: integer, minimum: 0 }
        exercises:
          type: array
          items: { $ref: "#/components/schemas/MesocycleExerciseInput" }
    MesocycleSaveInput:
      type: object
      required: [name, startDate, cycleLengthWeeks, days]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        startDate: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
        cycleLengthWeeks: { type: integer, minimum: 1, maximum: 52 }
        days:
          type: array
          items: { $ref: "#/components/schemas/MesocycleDayInput" }
    WorkoutSet:
      type: object
      required: [id, workoutExerciseId, setNumber, setType, targetWeight, targetRepsMin, targetRepsMax, actualWeight, actualReps, actualRir, metricValues, completed, removed, adaptiveTargetWeight, adaptiveTargetReps, adaptiveTargetRir, adaptiveWarning, targetStatus, targetExplanation, algorithmVersion, completedAt, workflowState]
      properties:
        referenceTargetWeight: { type: ["number", "null"] }
        referenceTargetReps: { type: ["integer", "null"] }
        referenceTargetRir: { type: ["number", "null"] }
        id: { type: integer }
        workoutExerciseId: { type: integer }
        setNumber: { type: integer }
        setType: { type: string, enum: [work, warmup] }
        targetWeight: { type: ["number", "null"] }
        targetRepsMin: { type: ["integer", "null"] }
        targetRepsMax: { type: ["integer", "null"] }
        actualWeight: { type: ["number", "null"] }
        actualReps: { type: ["integer", "null"] }
        actualRir: { type: ["number", "null"] }
        metricValues:
          type: ["array", "null"]
          maxItems: 2
          description: Values are stored in canonical units (kg, m, seconds, counts or kcal), in the exercise's configured metric order.
          items: { type: ["number", "null"], minimum: 0 }
        removed: { type: boolean }
        adaptiveTargetWeight: { type: ["number", "null"] }
        adaptiveTargetReps: { type: ["integer", "null"] }
        adaptiveTargetRir: { type: ["number", "null"] }
        adaptiveWarning: { type: ["string", "null"] }
        targetStatus: { type: ["string", "null"], enum: [target_met, above_target, below_target, null] }
        targetExplanation: { type: ["string", "null"] }
        algorithmVersion: { type: ["string", "null"] }
        completed: { type: boolean }
        completedAt: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }
        workflowState: { type: string, enum: [locked, active, unlocked] }
    WorkoutExercise:
      type: object
      required: [id, sessionId, exerciseId, exerciseName, muscleGroup, targetRir, targetSets, minimumWorkingSets, maximumWorkingSets, targetRepsMin, targetRepsMax, orderIndex, superseded, skipped, painReported, painNote, category, metricDefinitions, isCompound, recommendedWeight, recommendedReps, recommendationOutcome, recommendationRationale, substitutedFromExerciseId, calibrationMode, calibrationRir, baselineStatus, sets]
      properties:
        loadIncrement: { type: number }
        recoveryAdjustment: { type: ["string", "null"] }
        normalSetCount: { type: ["integer", "null"] }
        id: { type: integer }
        sessionId: { type: integer }
        exerciseId: { type: integer }
        exerciseName: { type: string }
        muscleGroup: { type: string }
        targetRir: { type: ["number", "null"] }
        targetSets: { type: integer }
        minimumWorkingSets: { type: integer }
        maximumWorkingSets: { type: integer }
        targetRepsMin: { type: ["integer", "null"] }
        targetRepsMax: { type: ["integer", "null"] }
        targetWeight: { type: ["number", "null"] }
        orderIndex: { type: integer }
        superseded: { type: boolean }
        skipped: { type: boolean }
        painReported: { type: boolean }
        painNote: { type: ["string", "null"] }
        category: { type: string, enum: [strength, bodyweight, calisthenics, cardio, plyometric, carry, sled, conditioning, mobility, other] }
        metricDefinitions:
          type: ["array", "null"]
          maxItems: 2
          items: { $ref: "#/components/schemas/ExerciseMetricDefinition" }
        isCompound: { type: boolean }
        recommendedWeight: { type: ["number", "null"] }
        recommendedReps: { type: ["integer", "null"] }
        recommendationOutcome: { type: ["string", "null"], enum: [increase_load, increase_reps, increase_sets, decrease_sets, maintain, null] }
        recommendationRationale: { type: ["string", "null"] }
        substitutedFromExerciseId: { type: ["integer", "null"] }
        calibrationMode: { type: boolean }
        calibrationRir: { type: ["number", "null"], minimum: 0, maximum: 10, description: Calibration uses the configured week RIR. }
        baselineStatus: { type: ["string", "null"], enum: [no_baseline, active, expired, null] }
        sets:
          type: array
          items: { $ref: "#/components/schemas/WorkoutSet" }
    WorkoutExerciseInput:
      type: object
      required: [exerciseId, targetSets, orderIndex]
      properties:
        exerciseId: { type: integer }
        targetRir: { type: ["number", "null"], minimum: 0, maximum: 10 }
        targetSets: { type: integer, minimum: 1, maximum: 20 }
        minimumWorkingSets: { type: integer, minimum: 1, maximum: 20 }
        maximumWorkingSets: { type: integer, minimum: 1, maximum: 20 }
        targetRepsMin: { type: ["integer", "null"], minimum: 1 }
        targetRepsMax: { type: ["integer", "null"], minimum: 1 }
        targetWeight: { type: ["number", "null"], minimum: 0 }
        orderIndex: { type: integer, minimum: 0 }
    WorkoutExerciseSubstitution:
      type: object
      required: [exerciseId]
      properties:
        exerciseId: { type: integer }
        updateMesocycle: { type: boolean, default: false }
    WorkoutExerciseFeedback:
      type: object
      properties:
        skipped: { type: boolean }
        painReported: { type: boolean }
        painNote: { type: ["string", "null"] }
    WorkoutSetInput:
      type: object
      required: [workoutExerciseId, setNumber, setType]
      properties:
        workoutExerciseId: { type: integer }
        setNumber: { type: integer, minimum: 1 }
        setType: { type: string, enum: [work, warmup] }
        targetWeight: { type: ["number", "null"], minimum: 0 }
        targetRepsMin: { type: ["integer", "null"], minimum: 1 }
        targetRepsMax: { type: ["integer", "null"], minimum: 1 }
        actualWeight: { type: ["number", "null"], minimum: 0 }
        actualReps: { type: ["integer", "null"], minimum: 0 }
        actualRir: { type: ["number", "null"], minimum: 0, maximum: 10 }
        completed: { type: boolean, default: false }
        notes: { type: ["string", "null"] }
    WorkoutSetUpdate:
      type: object
      properties:
        setNumber: { type: integer, minimum: 1 }
        setType: { type: string, enum: [work, warmup] }
        targetWeight: { type: ["number", "null"], minimum: 0 }
        targetRepsMin: { type: ["integer", "null"], minimum: 1 }
        targetRepsMax: { type: ["integer", "null"], minimum: 1 }
        actualWeight: { type: ["number", "null"], minimum: 0 }
        actualReps: { type: ["integer", "null"], minimum: 0 }
        actualRir: { type: ["number", "null"], minimum: 0, maximum: 10 }
        metricValues:
          type: ["array", "null"]
          maxItems: 2
          items: { type: ["number", "null"], minimum: 0 }
        completed: { type: boolean }
        editIntent:
          type: boolean
          description: Must be true to modify an already completed row; blank prefills are not completed performance.
        notes: { type: ["string", "null"] }
    WorkoutSetCompletionInput:
      type: object
      properties:
        actualWeight: { type: ["number", "null"], minimum: 0 }
        actualReps: { type: ["integer", "null"], minimum: 0 }
        actualRir: { type: ["number", "null"], minimum: 0, maximum: 10 }
        metricValues:
          type: ["array", "null"]
          maxItems: 2
          items: { type: ["number", "null"], minimum: 0 }
        notes: { type: ["string", "null"] }
    WorkoutSetWorkflowResult:
      type: object
      required: [set, nextSet]
      properties:
        set: { $ref: "#/components/schemas/WorkoutSet" }
        nextSet:
          oneOf:
            - $ref: "#/components/schemas/WorkoutSet"
            - type: "null"
    WorkoutSession:
      type: object
      required: [id, profileId, splitId, splitDayId, splitName, dayName, status, startedAt, endedAt, totalVolume, readiness, mesocycleStartDate, mesocycleWeek, muscleRecovery, muscleTotals, exercises, weekId, plannedWorkoutId, weekKindSnapshot, targetRirSnapshot, recoveryMode, trainingMode]
      properties:
        id: { type: integer }
        profileId: { type: integer }
        splitId: { type: ["integer", "null"] }
        splitDayId: { type: ["integer", "null"] }
        splitName: { type: ["string", "null"] }
        dayName: { type: ["string", "null"] }
        status: { type: string, enum: [active, completed] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: ["string", "null"], format: date-time }
        totalVolume: { type: number }
        readiness: { type: ["string", "null"], enum: [great, normal, below_normal, poor, null] }
        mesocycleStartDate: { type: ["string", "null"], pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
        mesocycleWeek: { type: ["integer", "null"] }
        weekId: { type: ["integer", "null"] }
        plannedWorkoutId: { type: ["integer", "null"] }
        weekKindSnapshot: { type: ["string", "null"], enum: [loading, deload, week_off, null] }
        targetRirSnapshot: { type: ["number", "null"] }
        recoveryMode: { type: ["string", "null"], enum: [deload, week_off, null] }
        trainingMode: { type: string, enum: [basic, legendary_pro] }
        muscleRecovery:
          type: array
          items: { $ref: "#/components/schemas/MuscleRecovery" }
        muscleTotals:
          type: array
          items: { $ref: "#/components/schemas/MuscleTotal" }
        exercises:
          type: array
          items: { $ref: "#/components/schemas/WorkoutExercise" }
    ActiveWorkoutState:
      type: object
      required: [workout]
      properties:
        workout:
          oneOf:
            - $ref: "#/components/schemas/WorkoutSession"
            - type: "null"
    StartWorkoutInput:
      type: object
      required: [profileId]
      properties:
        profileId: { type: integer }
        splitDayId: { type: ["integer", "null"] }
        scheduledWorkoutId:
          type: ["integer", "null"]
          description: Optional occurrence linkage; omit for legacy or free-start workouts.
        readiness: { type: string, enum: [great, normal, below_normal, poor] }
        muscleRecovery:
          type: array
          items: { $ref: "#/components/schemas/MuscleRecoveryInput" }
    MuscleRecoveryInput:
      type: object
      required: [muscleGroup, status]
      properties:
        muscleGroup: { type: string, minLength: 1, maxLength: 60 }
        status: { type: string, enum: [fully_recovered, slightly_fatigued, still_sore, very_sore] }
    MuscleRecovery:
      allOf:
        - $ref: "#/components/schemas/MuscleRecoveryInput"
    MuscleTotal:
      type: object
      required: [muscleGroup, totalWeightLifted]
      properties:
        muscleGroup: { type: string }
        totalWeightLifted: { type: number }
    WorkoutSummary:
      type: object
      required: [id, profileId, splitName, dayName, status, startedAt, endedAt, totalVolume, exerciseCount, workingSetCount, muscleTotals, mesocycleWeek, readiness]
      properties:
        id: { type: integer }
        profileId: { type: integer }
        splitName: { type: ["string", "null"] }
        dayName: { type: ["string", "null"] }
        status: { type: string, enum: [completed] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: ["string", "null"], format: date-time }
        totalVolume: { type: number }
        exerciseCount: { type: integer }
        workingSetCount: { type: integer }
        muscleTotals:
          type: array
          items: { $ref: "#/components/schemas/MuscleTotal" }
        mesocycleWeek: { type: ["integer", "null"] }
        readiness: { type: ["string", "null"], enum: [great, normal, below_normal, poor, null] }
    WorkoutCalendarHistoryEntry:
      type: object
      required: [id, dayName, startedAt]
      properties:
        id: { type: integer }
        dayName: { type: ["string", "null"] }
        startedAt: { type: string, format: date-time }
    ExerciseHistoryEntry:
      type: object
      required: [sessionId, sessionDate, dayName, setNumber, setType, targetWeight, targetRepsMin, targetRepsMax, actualWeight, actualReps, actualRir, metricDefinitions, metricValues]
      properties:
        sessionId: { type: integer }
        sessionDate: { type: string, format: date-time }
        dayName: { type: ["string", "null"] }
        setNumber: { type: integer }
        setType: { type: string, enum: [work, warmup] }
        targetWeight: { type: ["number", "null"] }
        targetRepsMin: { type: ["integer", "null"] }
        targetRepsMax: { type: ["integer", "null"] }
        actualWeight: { type: ["number", "null"] }
        actualReps: { type: ["integer", "null"] }
        actualRir: { type: ["number", "null"] }
        metricDefinitions:
          type: ["array", "null"]
          maxItems: 2
          items: { $ref: "#/components/schemas/ExerciseMetricDefinition" }
        metricValues:
          type: ["array", "null"]
          maxItems: 2
          items: { type: ["number", "null"], minimum: 0 }
    PersonalRecordSet:
      type: object
      required: [sessionId, setId, sessionDate, weight, reps, rir, estimatedOneRepMax, heaviestLoadRecord, legendaryPerformanceRecord]
      properties:
        sessionId: { type: integer }
        setId: { type: integer }
        sessionDate: { type: string, format: date-time, description: The workout start date/time, unchanged by later edits. }
        weight: { type: number }
        reps: { type: integer }
        rir: { type: ["number", "null"] }
        estimatedOneRepMax: { type: ["number", "null"], minimum: 0 }
        heaviestLoadRecord: { type: boolean }
        legendaryPerformanceRecord: { type: boolean }
    PersonalRecordExercise:
      type: object
      required: [exerciseId, exerciseName, heaviestLoad, bestPerformance, history]
      properties:
        exerciseId: { type: integer }
        exerciseName: { type: string }
        heaviestLoad:
          oneOf:
            - $ref: "#/components/schemas/PersonalRecordSet"
            - type: "null"
        bestPerformance:
          oneOf:
            - $ref: "#/components/schemas/PersonalRecordSet"
            - type: "null"
        history:
          type: array
          items: { $ref: "#/components/schemas/PersonalRecordSet" }
    PersonalRecords:
      type: object
      required: [profileId, weightUnit, exercises]
      properties:
        profileId: { type: integer }
        weightUnit: { type: string, enum: [kg, lb] }
        exercises:
          type: array
          items: { $ref: "#/components/schemas/PersonalRecordExercise" }
    NextWorkoutDay:
      type: object
      required: [splitId, splitName, dayId, dayName, dayIndex, exerciseCount]
      properties:
        splitId: { type: integer }
        splitName: { type: string }
        dayId: { type: integer }
        dayName: { type: string }
        dayIndex: { type: integer }
        exerciseCount: { type: integer }
    ProfileOverview:
      type: object
      required: [profile, activeWorkout, nextWorkout, workoutsThisWeek, volumeThisWeek, recentWorkouts, weeklyMuscleSets, previouslyTrainedMuscles]
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
        activeWorkout:
          oneOf:
            - $ref: "#/components/schemas/WorkoutSession"
            - type: "null"
        nextWorkout:
          oneOf:
            - $ref: "#/components/schemas/NextWorkoutDay"
            - type: "null"
        workoutsThisWeek: { type: integer }
        volumeThisWeek: { type: number }
        recentWorkouts:
          type: array
          items: { $ref: "#/components/schemas/WorkoutSummary" }
        weeklyMuscleSets:
          type: array
          items: { $ref: "#/components/schemas/WeeklyMuscleSets" }
        previouslyTrainedMuscles:
          type: array
          items: { type: string }
    WeeklyMuscleSets:
      type: object
      required: [muscleGroup, workingSetCount]
      properties:
        muscleGroup: { type: string }
        workingSetCount: { type: integer }
    FinishWorkoutResult:
      type: object
      required: [workout, nextWorkout, summary]
      properties:
        workout: { $ref: "#/components/schemas/WorkoutSession" }
        nextWorkout:
          oneOf:
            - $ref: "#/components/schemas/NextWorkoutDay"
            - type: "null"
        summary:
          type: object
          required: [exerciseCount, workingSetCount, newPrCount]
          properties:
            exerciseCount: { type: integer }
            workingSetCount: { type: integer }
            newPrCount: { type: integer }
    DateOnly:
      type: string
      description: Calendar date kept as a string; never parse through a timestamp.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    ProfileEngineSettings:
      type: object
      required: [profileId, baselineExpiryWeeks, loadIncrementLb, loadIncrementKg, deloadSetFraction, deloadLoadFraction, deloadRir]
      properties:
        profileId: { type: integer }
        baselineExpiryWeeks: { type: integer, minimum: 1, maximum: 104, default: 6 }
        loadIncrementLb: { type: number, exclusiveMinimum: 0, default: 2.5 }
        loadIncrementKg: { type: number, exclusiveMinimum: 0, default: 2.5 }
        deloadSetFraction: { type: number, exclusiveMinimum: 0, maximum: 1, default: 0.5 }
        deloadLoadFraction: { type: number, exclusiveMinimum: 0, maximum: 1, default: 0.9 }
        deloadRir: { type: number, minimum: 0, maximum: 10, default: 4 }
    ProfileEngineSettingsInput:
      type: object
      minProperties: 1
      properties:
        baselineExpiryWeeks: { type: integer, minimum: 1, maximum: 104 }
        loadIncrementLb: { type: number, exclusiveMinimum: 0 }
        loadIncrementKg: { type: number, exclusiveMinimum: 0 }
        deloadSetFraction: { type: number, exclusiveMinimum: 0, maximum: 1 }
        deloadLoadFraction: { type: number, exclusiveMinimum: 0, maximum: 1 }
        deloadRir: { type: number, minimum: 0, maximum: 10 }
    MesocycleWeekInput:
      type: object
      required: [weekIndex, kind, targetRir, scheduledWorkouts]
      properties:
        id: { type: integer, description: Existing week identifier when saving a draft; omit for a new week. }
        weekIndex: { type: integer, minimum: 1 }
        kind: { type: string, enum: [loading, deload, week_off] }
        targetRir:
          type: number
          minimum: 0
          maximum: 10
          description: Explicit week identity prescription, independent of calendar dates.
        scheduledWorkouts:
          type: array
          description: Ordered planned occurrences for this week; must be empty for week_off.
          items: { $ref: "#/components/schemas/PlannedWorkoutInput" }
    PlannedWorkoutInput:
      type: object
      required: [dayIndex, scheduledDate]
      properties:
        dayIndex: { type: integer, minimum: 0 }
        scheduledDate: { $ref: "#/components/schemas/DateOnly" }
        id: { type: integer, description: Existing occurrence ID when saving a draft. }
    MesocycleWeek:
      type: object
      required: [id, splitId, weekIndex, kind, targetRir, status, scheduledWorkouts, programSnapshot, sourceDescription]
      properties:
        id: { type: integer }
        splitId: { type: integer }
        weekIndex: { type: integer, minimum: 1 }
        kind: { type: string, enum: [loading, deload, week_off] }
        targetRir: { type: number, minimum: 0, maximum: 10 }
        status: { type: string, enum: [future, in_progress, completed] }
        scheduledWorkouts:
          type: array
          items: { $ref: "#/components/schemas/PlannedWorkout" }
        programSnapshot:
          type: ["object", "null"]
          additionalProperties: true
          description: Immutable structural snapshot used for reproducible copy/provenance.
        sourceDescription: { type: ["string", "null"] }
    PlannedWorkout:
      type: object
      required: [id, splitId, weekId, weekIndex, splitDayId, dayName, scheduledDate, originalScheduledDate, status, sessionId]
      properties:
        id: { type: integer }
        splitId: { type: integer }
        weekId: { type: integer }
        weekIndex: { type: integer }
        splitDayId: { type: integer }
        dayName: { type: string }
        scheduledDate: { $ref: "#/components/schemas/DateOnly" }
        originalScheduledDate: { $ref: "#/components/schemas/DateOnly" }
        status: { type: string, enum: [scheduled, completed, cancelled] }
        sessionId: { type: ["integer", "null"], description: Stable link to exact workout history when started/completed. }
    Mesocycle:
      type: object
      required: [id, profileId, name, startDate, cycleLengthWeeks, days, weeks, sourceDescription]
      properties:
        currentWeek: { type: integer }
        lifecycleStatus: { type: string, enum: [planned, active, paused, completed, ended_early, restarted] }
        completedWeeks: { type: integer, minimum: 0 }
        programmingVersion: { type: string }
        pausedAt: { type: ["string", "null"] }
        endedAt: { type: ["string", "null"] }
        restartFromId: { type: ["integer", "null"] }
        id: { type: integer }
        profileId: { type: integer }
        name: { type: string }
        startDate: { $ref: "#/components/schemas/DateOnly" }
        cycleLengthWeeks: { type: integer, minimum: 1 }
        days:
          type: array
          description: Ordered reusable workout-day templates shared across weeks.
          items: { $ref: "#/components/schemas/SplitDay" }
        weeks:
          type: array
          items: { $ref: "#/components/schemas/MesocycleWeek" }
        sourceDescription: { type: ["string", "null"] }
    NewMesocycleInput:
      type: object
      required: [name, startDate, days, weeks]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        startDate: { $ref: "#/components/schemas/DateOnly" }
        cycleLengthWeeks: { type: integer, minimum: 1, maximum: 104, description: Legacy-compatible derived cycle length; when omitted use weeks count. }
        days:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/MesocycleDayInput" }
        weeks:
          type: array
          description: >
            Ordered, extensible week schedule. New-cycle defaults are loading RIR 3, 2, 1, 0;
            do not impose a four-week limit or append a recovery week unless chosen.
          minItems: 1
          items: { $ref: "#/components/schemas/MesocycleWeekInput" }
        sourceDescription: { type: ["string", "null"] }
    MesocycleCreateInput:
      allOf:
        - $ref: "#/components/schemas/NewMesocycleInput"
        - type: object
          required: [profileId, createMode]
          properties:
            profileId: { type: integer }
            createMode: { type: string, enum: [template, copy_completed_week, build_own] }
            templateId: { type: ["string", "null"] }
            sourceWeekId:
              type: ["integer", "null"]
              description: Only eligible fully completed loading weeks may be selected.
    MesocycleTemplate:
      type: object
      required: [templateId, name, description, days, defaultLoadingRirs]
      properties:
        templateId: { type: string }
        name: { type: string }
        description: { type: string }
        days:
          type: array
          items: { $ref: "#/components/schemas/MesocycleDayInput" }
        defaultLoadingRirs:
          type: array
          items: { type: number, minimum: 0, maximum: 10 }
        defaultWeeks:
          type: array
          description: Optional explicit week structure for templates with interspersed deloads.
          items:
            type: object
            required: [kind, targetRir]
            properties:
              kind: { type: string, enum: [loading, deload] }
              targetRir: { type: ["number", "null"], minimum: 0, maximum: 10 }
    MesocycleCopyOptions:
      type: object
      required: [recommendedWeekId, eligibleWeeks]
      properties:
        recommendedWeekId: { type: ["integer", "null"] }
        eligibleWeeks:
          type: array
          items: { $ref: "#/components/schemas/CopyEligibleWeek" }
    CopyEligibleWeek:
      type: object
      required: [weekId, splitId, mesocycleName, weekIndex, completedAt, description, days]
      properties:
        weekId: { type: integer }
        splitId: { type: integer }
        mesocycleName: { type: string }
        weekIndex: { type: integer }
        completedAt: { type: string, format: date-time }
        description: { type: string, description: Reproducible provenance label, e.g. source cycle and Week N. }
        days:
          type: array
          description: Immutable workout structure from the completed week's frozen program snapshot; use these days rather than the source cycle's current draft.
          items: { $ref: "#/components/schemas/MesocycleDayInput" }
    CalendarWorkout:
      type: object
      required: [id, splitId, weekId, weekIndex, weekKind, targetRir, dayName, scheduledDate, originalScheduledDate, status, sessionId, isToday, projectedExercises]
      properties:
        id: { type: integer }
        splitId: { type: integer }
        weekId: { type: integer }
        weekIndex: { type: integer }
        weekKind: { type: string, enum: [loading, deload, week_off] }
        targetRir: { type: number }
        dayName: { type: string }
        scheduledDate: { $ref: "#/components/schemas/DateOnly" }
        originalScheduledDate: { $ref: "#/components/schemas/DateOnly" }
        status: { type: string, enum: [scheduled, completed, cancelled] }
        sessionId: { type: ["integer", "null"] }
        isToday: { type: boolean }
        projectedExercises:
          type: array
          items: { $ref: "#/components/schemas/ProjectedExercise" }
        relativeState: { type: string, enum: [past, today, future] }
    CalendarWeek:
      type: object
      required: [weekId, weekIndex, kind, targetRir, status, startDate, endDate, scheduledWorkouts]
      properties:
        weekId: { type: integer }
        weekIndex: { type: integer }
        kind: { type: string, enum: [loading, deload, week_off] }
        targetRir: { type: number }
        status: { type: string, enum: [future, in_progress, completed] }
        startDate: { $ref: "#/components/schemas/DateOnly" }
        endDate: { $ref: "#/components/schemas/DateOnly" }
        scheduledWorkouts:
          type: array
          description: Empty for Week Off; each linked session remains addressable in history.
          items: { $ref: "#/components/schemas/CalendarWorkout" }
    ProjectedExercise:
      type: object
      required: [exerciseId, exerciseName, targetSets, targetRepsMin, targetRepsMax, targetWeight, targetRir, baselineStatus, calibrationMode, calibrationRir, calibrationInstruction, recommendationExplanation]
      properties:
        exerciseId: { type: integer }
        exerciseName: { type: string }
        targetSets: { type: integer }
        targetRepsMin: { type: ["integer", "null"] }
        targetRepsMax: { type: ["integer", "null"] }
        targetWeight: { type: ["number", "null"], description: Canonical API weights are kilograms. }
        targetRir: { type: number }
        baselineStatus: { type: string, enum: [no_baseline, active, expired] }
        calibrationMode: { type: boolean }
        calibrationRir: { type: ["number", "null"], minimum: 0, maximum: 10 }
        calibrationInstruction: { type: ["string", "null"] }
        recommendationExplanation: { type: ["string", "null"] }
    RescheduleWorkoutInput:
      type: object
      required: [scheduledDate]
      properties:
        scheduledDate: { $ref: "#/components/schemas/DateOnly" }
        shiftFollowing: { type: boolean, default: false }
    RescheduleWorkoutResult:
      type: object
      required: [workout, recoveryWarning, warningMessage]
      properties:
        workout: { $ref: "#/components/schemas/PlannedWorkout" }
        recoveryWarning: { type: boolean }
        warningMessage: { type: ["string", "null"], description: Informational only; close spacing does not block scheduling. }
    ExerciseBaseline:
      type: object
      required: [exerciseId, status, sourceSessionId, sourceSetId, establishedAt, expiresAt, pausedWeekOffCount]
      properties:
        exerciseId: { type: integer }
        status: { type: string, enum: [no_baseline, active, expired] }
        sourceSessionId: { type: ["integer", "null"] }
        sourceSetId: { type: ["integer", "null"] }
        establishedAt: { type: ["string", "null"], format: date-time }
        expiresAt: { type: ["string", "null"], format: date-time }
        pausedWeekOffCount: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

